dataset:
  root_dir: /path/to/COCO2014
  name_list_dir: datasets/coco
  num_classes: 81
  crop_size: 320
  resize_range: [512, 2048]
  rescale_range: [0.5, 2.0]
  ignore_index: 255

work_dir:
  dir: work_dir_coco
  ckpt_dir: checkpoints
  pred_dir: predictions
  segs_dir: segs
  tb_logger_dir: tb_logger

train:
  split: train
  samples_per_gpu: 4 #8
  max_iters: 80000
  cam_iters: 5000
  eval_iters: 10000
  log_iters: 200
  ema_decay: 0.999
  ema_replace_start: 20000
  ema_ramp_iters: 40000
  ema_conf_thresh: 0.7
  ema_max_replace_ratio: 0.9

val:
  split: val

optimizer:
  type: AdamW
  learning_rate: 2e-5
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  warmup_iter: 50
  warmup_ratio: 1e-6
  power: 1.0

clip_init:
  clip_pretrain_path: pretrained/ViT-B-16.pt
  embedding_dim: 256
  in_channels: [768, 768,768,768]
  clip_flag: 16 # if VIT-B-16, set as 16
  resize_long: 512


sam3_init:
  sam3_model: 'facebook/sam3'

#-----------------dino-------------------------
# dino_init:
#   dino_model: 'vit_base_patch16_dinov3.lvd1689m'
#   dino_fts_fuse_dim: 768
#   decoder_layer: 3


dino_init:
  dino_model: 'vit_large_patch16_dinov3.lvd1689m'
  dino_fts_fuse_dim: 1024
  decoder_layer: 5



#---------prototype contrastive learning--------
prototype:
  momentum: 0.999
  temperature: 0.1
  confidence_thresh: 0.7
  loss_weight: 0.1

#---------boundary-aware distillation-----------
boundary:
  temperature: 2.0
  dilation: 2
  kl_weight: 1.0
  fidelity_weight: 1.0
  loss_weight: 0.1

